name: "Deploy to Cloud Run"
description: "Authenticate with GCP, deploy a new image to Cloud Run, and verify health"

inputs:
  service:
    description: "Service name (nexus-web, nexus-api, identity-api)"
    required: true
  environment:
    description: "Target environment (dev, staging, prod)"
    required: true
  gcp-sa-key:
    description: "GCP service account JSON key (raw JSON)"
    required: true
  gcp-project-id:
    description: "GCP project ID"
    required: false
    default: "gdgpup-484914"
  region:
    description: "Cloud Run region"
    required: false
    default: "asia-southeast1"
  health-check-url:
    description: "URL to curl after deployment to verify the service is up"
    required: false
    default: ""
  env-vars:
    description: "Comma-separated KEY=VALUE pairs to set as Cloud Run env vars (e.g. FOO=bar,BAZ=qux)"
    required: false
    default: ""
  memory:
    description: "Cloud Run memory limit (e.g. 512Mi, 1Gi, 2Gi). Defaults to service's existing setting if not set."
    required: false
    default: ""
  commit-sha:
    description: "Commit SHA to deploy the unique tag. If empty, falls back to the environment tag."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        # Note: If your secret is base64 encoded, this action usually handles it,
        # but ensure it is the raw JSON string for best compatibility.
        credentials_json: ${{ inputs.gcp-sa-key }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ inputs.gcp-project-id }}

    - name: Deploy to Cloud Run
      id: deploy
      shell: bash
      run: |
        SERVICE_NAME="${{ inputs.service }}-${{ inputs.environment }}"
        
        if [[ -n "${{ inputs.commit-sha }}" ]]; then
          SHORT_SHA=$(echo "${{ inputs.commit-sha }}" | cut -c1-7)
          IMAGE="docker.io/gdgpup/gdg-pup-platform-${{ inputs.service }}:${{ inputs.environment }}-$SHORT_SHA"
        else
          IMAGE="docker.io/gdgpup/gdg-pup-platform-${{ inputs.service }}:${{ inputs.environment }}"
        fi

        echo "==> Deploying $SERVICE_NAME with image $IMAGE"

        gcloud run deploy "$SERVICE_NAME" \
          --image="$IMAGE" \
          --region="${{ inputs.region }}" \
          --project="${{ inputs.gcp-project-id }}" \
          ${{ inputs.env-vars != '' && format('--update-env-vars "{0}"', inputs.env-vars) || '' }} \
          ${{ inputs.memory != '' && format('--memory "{0}"', inputs.memory) || '' }} \
          --quiet

    - name: Health check
      id: healthcheck
      if: ${{ inputs.health-check-url != '' }}
      shell: bash
      run: |
        echo "==> Waiting for service to stabilize..."
        # Loop to give Cloud Run a few attempts to pass the health check
        for i in {1..5}; do
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "${{ inputs.health-check-url }}")
          if [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]]; then
            echo "==> Health check passed (HTTP $STATUS)"
            exit 0
          fi
          echo "==> Attempt $i: Health check returned $STATUS. Retrying in 5s..."
          sleep 5
        done
        echo "::error::Health check failed after 5 attempts."
        exit 1

    - name: Rollback on failure
      # Only rollback if the health check failed after a "successful" deployment.
      # If the 'deploy' step itself fails, Cloud Run keeps the previous revision active.
      if: ${{ failure() && steps.healthcheck.outcome == 'failure' }}
      shell: bash
      run: |
        SERVICE_NAME="${{ inputs.service }}-${{ inputs.environment }}"
        echo "==> Health check failed, rolling back to the previous stable revision..."

        # Get the previous 'Ready' revision (the one before the broken LATEST)
        PREVIOUS_REVISION=$(gcloud run revisions list \
          --service="$SERVICE_NAME" \
          --region="${{ inputs.region }}" \
          --project="${{ inputs.gcp-project-id }}" \
          --filter="status.conditions.type:Ready AND status.conditions.status:'True'" \
          --format="value(metadata.name)" \
          --sort-by="~metadata.creationTimestamp" \
          | sed -n '2p')

        if [[ -n "$PREVIOUS_REVISION" ]]; then
          echo "==> Rolling back traffic to: $PREVIOUS_REVISION"
          gcloud run services update-traffic "$SERVICE_NAME" \
            --to-revisions="$PREVIOUS_REVISION=100" \
            --region="${{ inputs.region }}" \
            --project="${{ inputs.gcp-project-id }}"
          echo "==> Rollback to stable version complete."
        else
          echo "::warning::Could not identify a previous stable revision to roll back to."
        fi