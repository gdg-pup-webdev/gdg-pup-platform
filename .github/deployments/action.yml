name: "Deploy to Cloud Run"
description: "Authenticate with GCP, deploy a new image to Cloud Run, and verify health"

inputs:
  service:
    description: "Service name (nexus-web, nexus-api, identity-api)"
    required: true
  environment:
    description: "Target environment (dev, staging, prod)"
    required: true
  gcp-sa-key:
    description: "GCP service account JSON key (base64 or raw JSON)"
    required: true
  gcp-project-id:
    description: "GCP project ID"
    required: false
    default: "gdgpup-484914"
  region:
    description: "Cloud Run region"
    required: false
    default: "asia-southeast1"
  health-check-url:
    description: "URL to curl after deployment to verify the service is up"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.gcp-sa-key }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ inputs.gcp-project-id }}
        region: ${{ inputs.region }}

    - name: Deploy to Cloud Run
      id: deploy
      shell: bash
      run: |
        SERVICE_NAME="${{ inputs.service }}-${{ inputs.environment }}"
        IMAGE="docker.io/gdgpup/gdg-pup-platform-${{ inputs.service }}:${{ inputs.environment }}"

        echo "==> Deploying $SERVICE_NAME with image $IMAGE"

        gcloud run deploy "$SERVICE_NAME" \
          --image="$IMAGE" \
          --region="${{ inputs.region }}" \
          --project="${{ inputs.gcp-project-id }}" \
          --quiet

        echo "==> Deployment complete."

    - name: Health check
      id: healthcheck
      if: ${{ inputs.health-check-url != '' }}
      shell: bash
      run: |
        echo "==> Waiting for service to be ready..."
        sleep 10

        STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "${{ inputs.health-check-url }}")

        if [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]]; then
          echo "==> Health check passed (HTTP $STATUS)"
        else
          echo "::error::Health check failed for ${{ inputs.health-check-url }} (HTTP $STATUS)"
          exit 1
        fi

    - name: Rollback on failure
      if: ${{ failure() && steps.deploy.outcome == 'failure' || steps.healthcheck.outcome == 'failure' }}
      shell: bash
      run: |
        SERVICE_NAME="${{ inputs.service }}-${{ inputs.environment }}"
        echo "==> Deployment or health check failed, rolling back to previous revision..."

        # Get the previous revision
        PREVIOUS_REVISION=$(gcloud run revisions list \
          --service="$SERVICE_NAME" \
          --region="${{ inputs.region }}" \
          --project="${{ inputs.gcp-project-id }}" \
          --filter="status=Ready" \
          --format="value(metadata.name)" \
          | head -n 2 | tail -n 1)

        if [[ -n "$PREVIOUS_REVISION" ]]; then
          echo "==> Rolling back to $PREVIOUS_REVISION"
          gcloud run services update-traffic "$SERVICE_NAME" \
            --to-revisions="$PREVIOUS_REVISION=100" \
            --region="${{ inputs.region }}" \
            --project="${{ inputs.gcp-project-id }}"
          echo "==> Rollback complete."
        else
          echo "::warning::No previous revision found for rollback"
        fi
