name: Scrape GDG Events

on:
  schedule:
    # Run every day at MNL midnight (16:00 UTC)
    - cron: "0 16 * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run GDG Scraper Script
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_PROD }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY_PROD }}
          API_URL: ${{ secrets.API_URL_PROD }}
        run: npm run scrape
