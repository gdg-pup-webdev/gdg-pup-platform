# =============================================================================
# Deploy to Cloud Run
# =============================================================================
# Trigger: dispatched by Docker Build & Push with explicit branch parameter.
# Manual:  workflow_dispatch for branch testing with selectable environment.
# Mode:    Always deploy on workflow_dispatch from Docker B&P; selective on manual dispatch.
# Logic:   deploy → .github/deployments/action.yml
# Note:    never cancel in-progress deploys (cancel-in-progress: false)
# Note:    Storybook deploy is intentionally disabled until Cloud Run resources
#          and the Storybook subdomain/DNS are provisioned.
# =============================================================================

name: Deploy [Environment]
run-name: Deploy [${{ github.event.inputs.target_environment }}] @ ${{ github.event.inputs.triggered_branch || github.event.inputs.test_ref || github.ref_name }} (branch)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      triggered_branch:
        description: "Release branch that triggered this deploy (set by Docker B&P automation)"
        required: false
        type: string
        default: ""
      triggered_sha:
        description: "Commit SHA from the release branch (set by Docker B&P automation)"
        required: false
        type: string
        default: ""
      test_ref:
        description: "Branch, tag, or SHA to deploy (manual override)"
        required: false
        type: string
        default: ""
      force_deploy:
        description: "Deploy services even if no changes are detected"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.target_environment }}-${{ github.event.inputs.triggered_branch || github.event.inputs.test_ref || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    name: Detect Changes
    uses: ./.github/workflows/ci.detect-changes.yml
    with:
      head-sha: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
      head-branch: ${{ github.event.inputs.triggered_branch || (github.event.inputs.target_environment == 'prod' && 'main') || (github.event.inputs.target_environment == 'staging' && 'staging') || 'deploy-develop' }}

  deploy-nexus-web:
    name: nexus-web
    needs: detect-changes
    # From Docker B&P automation: triggered_branch is set → always deploy
    # From manual dispatch: respect path filter unless force_deploy is true
    if: ${{ github.event.inputs.triggered_branch != '' || inputs.force_deploy || needs.detect-changes.outputs.nexus-web == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-changes.outputs.environment == 'prod' && 'Prod Secrets' || needs.detect-changes.outputs.environment == 'staging' && 'Staging Secrets' || 'Dev Secrets' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
      - uses: ./.github/deployments
        with:
          service: nexus-web
          commit-sha: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
          environment: ${{ needs.detect-changes.outputs.environment }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'gdgpup-484914' }}
          health-check-url: ${{ needs.detect-changes.outputs.environment == 'prod' && 'https://gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://staging.gdgpup.org' || 'https://dev.gdgpup.org' }}
          env-vars: "NEXT_PUBLIC_SITE_URL=${{ needs.detect-changes.outputs.environment == 'prod' && 'https://gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://staging.gdgpup.org' || 'https://dev.gdgpup.org' }}"

  deploy-nexus-admin-web:
    name: nexus-admin-web
    needs: detect-changes
    # From Docker B&P automation: triggered_branch is set → always deploy
    # From manual dispatch: respect path filter unless force_deploy is true
    if: ${{ github.event.inputs.triggered_branch != '' || inputs.force_deploy || needs.detect-changes.outputs.nexus-admin-web == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-changes.outputs.environment == 'prod' && 'Prod Secrets' || needs.detect-changes.outputs.environment == 'staging' && 'Staging Secrets' || 'Dev Secrets' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
      - uses: ./.github/deployments
        with:
          service: nexus-admin-web
          commit-sha: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
          environment: ${{ needs.detect-changes.outputs.environment }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'gdgpup-484914' }}
          health-check-url: ${{ needs.detect-changes.outputs.environment == 'prod' && 'https://admin.gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://admin.staging.gdgpup.org' || 'https://admin.dev.gdgpup.org' }}
          env-vars: "NEXT_PUBLIC_NEXUS_API_URL=${{ needs.detect-changes.outputs.environment == 'prod' && 'https://api.gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://api.staging.gdgpup.org' || 'https://api.dev.gdgpup.org' }},NEXT_PUBLIC_IDENTITY_API_URL=${{ needs.detect-changes.outputs.environment == 'prod' && 'https://identity.gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://identity.staging.gdgpup.org' || 'https://identity.dev.gdgpup.org' }}"

  deploy-nexus-api:
    name: nexus-api
    needs: detect-changes
    # From Docker B&P automation: triggered_branch is set → always deploy
    # From manual dispatch: respect path filter unless force_deploy is true
    if: ${{ github.event.inputs.triggered_branch != '' || inputs.force_deploy || needs.detect-changes.outputs.nexus-api == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-changes.outputs.environment == 'prod' && 'Prod Secrets' || needs.detect-changes.outputs.environment == 'staging' && 'Staging Secrets' || 'Dev Secrets' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
      - uses: ./.github/deployments
        with:
          service: nexus-api
          commit-sha: ${{ github.event.inputs.triggered_sha || github.event.inputs.test_ref || github.sha }}
          environment: ${{ needs.detect-changes.outputs.environment }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'gdgpup-484914' }}
          health-check-url: ${{ needs.detect-changes.outputs.environment == 'prod' && 'https://api.gdgpup.org/api/health' || needs.detect-changes.outputs.environment == 'staging' && 'https://api.staging.gdgpup.org/api/health' || 'https://api.dev.gdgpup.org/api/health' }}
          memory: "512Mi"
          env-vars: "ZEPTOMAIL_TOKEN=${{ secrets.ZEPTOMAIL_TOKEN }},\
            ZEPTOMAIL_FROM_ADDRESS=${{ secrets.ZEPTOMAIL_FROM_ADDRESS }},\
            ZEPTOMAIL_FROM_NAME=${{ secrets.ZEPTOMAIL_FROM_NAME }},\
            HIDE_API_DOCS=${{ vars.HIDE_API_DOCS || secrets.HIDE_API_DOCS || 'false' }},\
            FILE_STORAGE_MAIN_PROVIDER=${{ vars.FILE_STORAGE_MAIN_PROVIDER || 'gcs' }},\
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'gdgpup-484914' }},\
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME || 'gdgpuporgstorage' }},\
            GCS_PREVIEW_URL_TYPE=${{ vars.GCS_PREVIEW_URL_TYPE || 'signed' }},\
            GCS_SIGNED_URL_EXPIRES_SECONDS=${{ vars.GCS_SIGNED_URL_EXPIRES_SECONDS || '900' }},\
            GCS_MAKE_PUBLIC_ON_UPLOAD=${{ vars.GCS_MAKE_PUBLIC_ON_UPLOAD || 'false' }},\
            GCS_PUBLIC_BASE_URL=${{ vars.GCS_PUBLIC_BASE_URL || 'https://storage.googleapis.com' }},\
            GCS_UPLOAD_PREFIX=${{ vars.GCS_UPLOAD_PREFIX || 'uploads' }},\
            GCS_CREDENTIALS_BASE64=${{ secrets.GCS_CREDENTIALS_BASE64 }},\
            CLIENT_URL=${{ needs.detect-changes.outputs.environment == 'prod' && 'https://gdgpup.org|https://admin.gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://staging.gdgpup.org|https://admin.staging.gdgpup.org' || 'https://dev.gdgpup.org|https://admin.dev.gdgpup.org' }}"