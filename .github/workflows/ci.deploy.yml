# =============================================================================
# Deploy to Cloud Run
# =============================================================================
# Trigger: after Docker Build & Push succeeds.
# Manual:  workflow_dispatch for branch testing with selectable environment.
# Mode:    Selective deployments (only changed services)
# Logic:   deploy → .github/deployments/action.yml
# Note:    never cancel in-progress deploys (cancel-in-progress: false)
# Note:    Storybook deploy is intentionally disabled until Cloud Run resources
#          and the Storybook subdomain/DNS are provisioned.
# =============================================================================

name: Deploy [Environment]
run-name: Deploy [${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment || github.event.workflow_run.head_branch == 'main' && 'prod' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'dev' }}]

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [deploy-develop, staging, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      test_ref:
        description: "Branch, tag, or SHA to deploy"
        required: false
        type: string
        default: "feat/ci-cd-implementation"

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target_environment == 'prod' && 'prod' || github.event.inputs.target_environment == 'staging' && 'staging' || 'dev') || github.event.workflow_run.head_branch }}-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_ref || github.ref_name) || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      nexus-web: ${{ steps.detect.outputs.nexus-web }}
      nexus-api: ${{ steps.detect.outputs.nexus-api }}
      identity-api: ${{ steps.detect.outputs.identity-api }}
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_ref || github.sha) || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Detect changes
        id: detect
        uses: ./.github/workflows/ci.detect-changes
        with:
          head-sha: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_ref || github.sha) || github.event.workflow_run.head_sha }}
          head-branch: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod' && 'main' || github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging' && 'staging' || github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev' && 'deploy-develop' || github.event.workflow_run.head_branch }}

  deploy-nexus-web:
    name: nexus-web
    needs: detect-changes
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.detect-changes.outputs.nexus-web == 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.nexus-web == 'true') }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.nexus-web == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_ref || github.sha) || github.event.workflow_run.head_sha }}
      - uses: ./.github/deployments
        with:
          service: nexus-web
          environment: ${{ needs.detect-changes.outputs.environment }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}
          health-check-url: ${{ needs.detect-changes.outputs.environment == 'prod' && 'https://gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://staging.gdgpup.org' || 'https://dev.gdgpup.org' }}

  deploy-nexus-api:
    name: nexus-api
    needs: detect-changes
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.detect-changes.outputs.nexus-api == 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.nexus-api == 'true') }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.nexus-api == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_ref || github.sha) || github.event.workflow_run.head_sha }}
      - uses: ./.github/deployments
        with:
          service: nexus-api
          environment: ${{ needs.detect-changes.outputs.environment }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}
          health-check-url: ${{ needs.detect-changes.outputs.environment == 'prod' && 'https://api.gdgpup.org/api/health' || needs.detect-changes.outputs.environment == 'staging' && 'https://api.staging.gdgpup.org/api/health' || 'https://api.dev.gdgpup.org/api/health' }}

  deploy-identity-api:
    name: identity-api
    needs: detect-changes
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.detect-changes.outputs.identity-api == 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.identity-api == 'true') }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.identity-api == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_ref || github.sha) || github.event.workflow_run.head_sha }}
      - uses: ./.github/deployments
        with:
          service: identity-api
          environment: ${{ needs.detect-changes.outputs.environment }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}
          health-check-url: ${{ needs.detect-changes.outputs.environment == 'prod' && 'https://identity.gdgpup.org/api/health' || needs.detect-changes.outputs.environment == 'staging' && 'https://identity.staging.gdgpup.org/api/health' || 'https://identity.dev.gdgpup.org/api/health' }}
