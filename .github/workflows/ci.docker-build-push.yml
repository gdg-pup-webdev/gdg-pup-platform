# =============================================================================
# Docker Build & Push
# =============================================================================
# Trigger: Successful completion of Test workflow
# Mode:    Selective builds (only changed services)
# =============================================================================

name: Docker Build & Push

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      nexus-web: ${{ steps.detect.outputs.nexus-web }}
      nexus-api: ${{ steps.detect.outputs.nexus-api }}
      identity-api: ${{ steps.detect.outputs.identity-api }}
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changes
        id: detect
        uses: ./.github/workflows/ci.detect-changes
        with:
          head-sha: ${{ github.event.workflow_run.head_sha }}
          head-branch: ${{ github.event.workflow_run.head_branch }}

  build-nexus-web:
    name: nexus-web
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.nexus-web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: nexus-web
          environment: ${{ needs.detect-changes.outputs.environment }}
          dockerfile: apps/nexus-web/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          build-args: |
            NEXT_PUBLIC_NEXUS_API_URL=${{ needs.detect-changes.outputs.environment == 'prod' && 'https://api.gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://api.staging.gdgpup.org' || 'https://api.dev.gdgpup.org' }}
            NEXT_PUBLIC_IDENTITY_API_URL=${{ needs.detect-changes.outputs.environment == 'prod' && 'https://identity.gdgpup.org' || needs.detect-changes.outputs.environment == 'staging' && 'https://identity.staging.gdgpup.org' || 'https://identity.dev.gdgpup.org' }}

  build-nexus-api:
    name: nexus-api
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.nexus-api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: nexus-api
          environment: ${{ needs.detect-changes.outputs.environment }}
          dockerfile: apps/nexus-api/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

  build-identity-api:
    name: identity-api
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.identity-api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: identity-api
          environment: ${{ needs.detect-changes.outputs.environment }}
          dockerfile: apps/identity-api/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
