# =============================================================================
# Docker Build & Push
# =============================================================================
# Trigger: push to deploy branches (or manual dispatch).
# Mode:    selective (builds only changed services, including storybook).
# =============================================================================

name: Docker Build & Push

on:
  push:
    branches: [deploy-develop, staging, main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      nexus-web: ${{ steps.filter.outputs.nexus-web }}
      nexus-api: ${{ steps.filter.outputs.nexus-api }}
      identity-api: ${{ steps.filter.outputs.identity-api }}
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nexus-web:
              - 'apps/nexus-web/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            nexus-api:
              - 'apps/nexus-api/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            identity-api:
              - 'apps/identity-api/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            storybook:
              - 'apps/storybook/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  build-nexus-web:
    name: nexus-web
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nexus-web == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: nexus-web
          environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
          dockerfile: apps/nexus-web/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          build-args: |
            NEXT_PUBLIC_NEXUS_API_URL=${{ github.ref_name == 'main' && 'https://api.gdgpup.org' || github.ref_name == 'staging' && 'https://api.staging.gdgpup.org' || 'https://api.dev.gdgpup.org' }}
            NEXT_PUBLIC_IDENTITY_API_URL=${{ github.ref_name == 'main' && 'https://identity.gdgpup.org' || github.ref_name == 'staging' && 'https://identity.staging.gdgpup.org' || 'https://identity.dev.gdgpup.org' }}

  build-nexus-api:
    name: nexus-api
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nexus-api == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: nexus-api
          environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
          dockerfile: apps/nexus-api/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

  build-identity-api:
    name: identity-api
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.identity-api == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: identity-api
          environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
          dockerfile: apps/identity-api/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

  build-storybook:
    name: storybook
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.storybook == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/builds
        with:
          service: storybook
          environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
          dockerfile: apps/storybook/Dockerfile
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}